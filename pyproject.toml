[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic_fracture"
version = "0.1.0"
description = "A multi-agent system that turns plain English into a verified phase-field fracture FEA simulation."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Aarosh Dahal" }]
keywords = [
    "phase-field",
    "fracture",
    "FEM",
    "FEniCSx",
    "DOLFINx",
    "agents",
    "LLM",
    "Gemini",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "requests>=2.31",
    "pydantic>=2.5",
    "flask>=3.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/aaroshdahal/agentic_fracture"

[project.scripts]
fracture-agent = "fracture_agent.main:main"

[tool.setuptools.packages.find]
include = ["fracture_agent*", "modular*"]
exclude = ["agentic_simulations*", "papers*"]
